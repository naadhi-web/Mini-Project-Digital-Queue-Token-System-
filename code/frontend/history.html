{% extends "core/base.html" %}
{% block content %}
<h4>My Visit History</h4>
<table class="table">
  <thead><tr><th>Date</th><th>Slot</th><th>Token</th><th>Outcome</th></tr></thead>
  <tbody>
    {% for h in history %}
      <tr>
        <td>{{ h.timestamp }}</td>
        <td>{{ h.slot }}</td>
        <td>T{{ h.token_number }}</td>
        <td>{{ h.outcome }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="4">No history found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
